<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pacific Drift asset review</title><style>body{margin:0;background:#27333e;color:white;font:14px system-ui}canvas{display:block}nav{position:absolute;top:20px;left:20px;display:flex;gap:12px}button{padding:8px 14px}</style></head><body><nav><button id="front">Front</button><button id="side">Side</button><button id="top">Top</button><select id="part"><option value="all">Whole model</option><option value="Hull">Hull</option><option value="Fittings">Fittings</option><option value="Sail">Sail</option><option value="Lacing">Lacing</option><option value="Port_oar">Port oar</option><option value="Starboard_oar">Starboard oar</option></select></nav><script type="module">
import * as THREE from 'three';import {GLTFLoader} from 'three/examples/jsm/loaders/GLTFLoader.js';import {OrbitControls} from 'three/examples/jsm/controls/OrbitControls.js';
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(devicePixelRatio);renderer.setClearColor(0x27333e);document.body.append(renderer.domElement);
const scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(40,innerWidth/innerHeight,.01,100);camera.position.set(2.5,1.5,2.5);const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;
scene.add(new THREE.HemisphereLight(0xffffff,0x334455,3));const sun=new THREE.DirectionalLight(0xffffff,3);sun.position.set(2,4,3);scene.add(sun);
const gltf=await new GLTFLoader().loadAsync(new URLSearchParams(location.search).has('boat')?'/models/rowing-boat.glb':new URLSearchParams(location.search).has('whale')?'/models/humpback.glb':'/models/albatross.glb');scene.add(gltf.scene);if(new URLSearchParams(location.search).has('boat')){controls.target.set(0,1,0);camera.position.set(6,5,7);controls.update();}
for(const [id,p] of Object.entries({front:[0,.2,3.8],side:[3.8,.2,0],top:[0,3.8,0.01]}))document.getElementById(id).onclick=()=>{camera.position.set(...p);controls.target.set(0,0,0);controls.update();};
document.getElementById('part').onchange=e=>{gltf.scene.traverse(o=>{if(o.isMesh)o.visible=e.target.value==='all'||o.name===e.target.value;});};function frame(){requestAnimationFrame(frame);controls.update();renderer.render(scene,camera);}frame();
</script></body></html>
